<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1130" viewBox="0 0 720 1130" role="img" aria-labelledby="title"><title id="title">Saffir-Simpson wind thresholds; wind only, not local water depth</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="36" y="65" font-size="40" font-weight="700" fill="#163e50">Hurricane wind categories</text><text x="36" y="120" font-size="30" font-weight="400" fill="#163e50">Maximum sustained wind only</text><text x="42" y="196" font-size="32" font-weight="700" fill="#163e50">Category</text><text x="245" y="196" font-size="32" font-weight="700" fill="#163e50">mph</text><text x="470" y="196" font-size="32" font-weight="700" fill="#163e50">knots</text><rect x="30" y="220" width="660" height="96" rx="10" fill="#e3f1f4"/><text x="60" y="280" font-size="38" font-weight="700" fill="#163e50">1</text><text x="245" y="280" font-size="36" font-weight="400" fill="#163e50">74–95</text><text x="470" y="280" font-size="36" font-weight="400" fill="#163e50">64–82</text><rect x="30" y="332" width="660" height="96" rx="10" fill="#e3f1f4"/><text x="60" y="392" font-size="38" font-weight="700" fill="#163e50">2</text><text x="245" y="392" font-size="36" font-weight="400" fill="#163e50">96–110</text><text x="470" y="392" font-size="36" font-weight="400" fill="#163e50">83–95</text><rect x="30" y="444" width="660" height="96" rx="10" fill="#fff0dc"/><text x="60" y="504" font-size="38" font-weight="700" fill="#163e50">3</text><text x="245" y="504" font-size="36" font-weight="400" fill="#163e50">111–129</text><text x="470" y="504" font-size="36" font-weight="400" fill="#163e50">96–112</text><rect x="30" y="556" width="660" height="96" rx="10" fill="#fff0dc"/><text x="60" y="616" font-size="38" font-weight="700" fill="#163e50">4</text><text x="245" y="616" font-size="36" font-weight="400" fill="#163e50">130–156</text><text x="470" y="616" font-size="36" font-weight="400" fill="#163e50">113–136</text><rect x="30" y="668" width="660" height="96" rx="10" fill="#fff0dc"/><text x="60" y="728" font-size="38" font-weight="700" fill="#163e50">5</text><text x="245" y="728" font-size="36" font-weight="400" fill="#163e50">157+</text><text x="470" y="728" font-size="36" font-weight="400" fill="#163e50">137+</text><text x="36" y="840" font-size="30" font-weight="400" fill="#163e50">Categories 3–5 are major hurricanes.</text><text x="36" y="882" font-size="30" font-weight="400" fill="#163e50">Surge, rain and tornado hazards</text><text x="36" y="924" font-size="30" font-weight="400" fill="#163e50">need separate products and alerts.</text><text x="36" y="966" font-size="30" font-weight="400" fill="#163e50">No address-level damage prediction.</text></g></svg>
