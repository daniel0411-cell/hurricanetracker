<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Differences between hurricane track, storm surge, rainfall, and local alerts</title><desc id="desc">Four map products answer different hurricane risk questions.</desc>
  <rect width="1200" height="675" fill="#f3f8fa"/><rect x="54" y="48" width="1092" height="579" rx="20" fill="#fff" stroke="#b7cbd4" stroke-width="2"/>
  <text x="94" y="114" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123849">One storm, four different map questions</text><text x="94" y="153" font-family="Arial,sans-serif" font-size="21" fill="#496773">Do not use the forecast cone as a complete impact map.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(92 205)"><rect width="493" height="155" rx="14" fill="#e7f3f7" stroke="#6ca1b5"/><text x="28" y="45" font-size="25" font-weight="700" fill="#123849">FORECAST TRACK &amp; CONE</text><text x="28" y="84" font-size="19" fill="#334f5a">Where could the storm center move?</text><text x="28" y="113" font-size="19" fill="#334f5a">The cone is not an impact boundary.</text></g>
  <g transform="translate(615 205)"><rect width="493" height="155" rx="14" fill="#dfeff5" stroke="#5f9db5"/><text x="28" y="45" font-size="25" font-weight="700" fill="#123849">STORM SURGE MAP</text><text x="28" y="84" font-size="19" fill="#334f5a">Where could coastal water rise?</text><text x="28" y="113" font-size="19" fill="#334f5a">Check elevation and evacuation zones.</text></g>
  <g transform="translate(92 386)"><rect width="493" height="155" rx="14" fill="#edf5ee" stroke="#79a184"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173f25">RAINFALL &amp; FLOOD MAPS</text><text x="28" y="84" font-size="19" fill="#385744">Where could water fall or collect?</text><text x="28" y="113" font-size="19" fill="#385744">Danger can extend far inland.</text></g>
  <g transform="translate(615 386)"><rect width="493" height="155" rx="14" fill="#fff0e9" stroke="#d98a70"/><text x="28" y="45" font-size="25" font-weight="700" fill="#6e2d19">NWS &amp; LOCAL ALERTS</text><text x="28" y="84" font-size="19" fill="#63382c">What official action applies here?</text><text x="28" y="113" font-size="19" fill="#63382c">Warnings and orders drive decisions.</text></g></g>
  <text x="94" y="590" font-family="Arial,sans-serif" font-size="18" fill="#496773">Use the latest NHC, NWS and local emergency-management products together.</text>
</svg>
