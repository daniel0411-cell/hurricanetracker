<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1446" viewBox="0 0 720 1446" role="img" aria-labelledby="title"><title id="title">Four records for a local check</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="40" y="64" font-size="36" font-weight="700" fill="#254653">Four records for a local check</text><rect x="32" y="190" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="190" width="8" height="230" fill="#176b87"/><text x="56" y="238" font-size="30" font-weight="700" fill="#254653">1. Location</text><text x="56" y="302" font-size="28" font-weight="400" fill="#254653">Exact address and responsible county</text><text x="56" y="342.6" font-size="28" font-weight="400" fill="#254653">ZIP point is not an evacuation zone</text><rect x="32" y="460" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="460" width="8" height="230" fill="#39734a"/><text x="56" y="508" font-size="30" font-weight="700" fill="#254653">2. Weather message</text><text x="56" y="572" font-size="28" font-weight="400" fill="#254653">Issuer, affected area and valid time</text><text x="56" y="612.6" font-size="28" font-weight="400" fill="#254653">Keep the original warning link</text><rect x="32" y="730" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="730" width="8" height="230" fill="#ad5b23"/><text x="56" y="778" font-size="30" font-weight="700" fill="#254653">3. Local instruction</text><text x="56" y="842" font-size="28" font-weight="400" fill="#254653">Address lookup and current order</text><text x="56" y="882.6" font-size="28" font-weight="400" fill="#254653">A standing zone is not an active order</text><rect x="32" y="1000" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="1000" width="8" height="230" fill="#5a527c"/><text x="56" y="1048" font-size="30" font-weight="700" fill="#254653">4. Arrangements</text><text x="56" y="1112" font-size="28" font-weight="400" fill="#254653">Permitted route, ride and destination</text><text x="56" y="1152.6" font-size="28" font-weight="400" fill="#254653">Requested is different from confirmed</text><text x="40" y="1275" font-size="24" font-weight="400" fill="#254653">Planning diagram only: no zones, routes or</text><text x="40" y="1309.8" font-size="24" font-weight="400" fill="#254653">current orders shown.</text><text x="40" y="1344.6" font-size="24" font-weight="400" fill="#254653">Use the official resources linked in the</text><text x="40" y="1379.4" font-size="24" font-weight="400" fill="#254653">guide.</text></g></svg>
