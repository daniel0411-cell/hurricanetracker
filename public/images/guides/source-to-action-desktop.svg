<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Match the question to the source</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="40" y="64" font-size="42" font-weight="700" fill="#254653">Match the question to the source</text><text x="40" y="115" font-size="26" font-weight="400" fill="#254653">Different checks answer different questions.</text><rect x="40" y="175" width="350" height="350" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="40" y="175" width="8" height="350" fill="#176b87"/><text x="64" y="223" font-size="27" font-weight="700" fill="#254653">NHC: storm context</text><text x="64" y="320" font-size="26" font-weight="400" fill="#254653">Basin, storm</text><text x="64" y="357.7" font-size="26" font-weight="400" fill="#254653">identifier and</text><text x="64" y="395.4" font-size="26" font-weight="400" fill="#254653">advisory time</text><text x="64" y="433.1" font-size="26" font-weight="400" fill="#254653">Position and forecast</text><text x="64" y="470.79999999999995" font-size="26" font-weight="400" fill="#254653">valid times</text><rect x="426" y="175" width="350" height="350" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="426" y="175" width="8" height="350" fill="#39734a"/><text x="450" y="223" font-size="27" font-weight="700" fill="#254653">NWS: local</text><text x="450" y="262.15" font-size="27" font-weight="700" fill="#254653">weather alerts</text><text x="450" y="320" font-size="26" font-weight="400" fill="#254653">Affected area, hazard</text><text x="450" y="357.7" font-size="26" font-weight="400" fill="#254653">and valid period</text><text x="450" y="395.4" font-size="26" font-weight="400" fill="#254653">Read the protective</text><text x="450" y="433.1" font-size="26" font-weight="400" fill="#254653">instruction</text><rect x="812" y="175" width="350" height="350" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="812" y="175" width="8" height="350" fill="#ad5b23"/><text x="836" y="223" font-size="27" font-weight="700" fill="#254653">Local authority: action</text><text x="836" y="320" font-size="26" font-weight="400" fill="#254653">Address, zone and</text><text x="836" y="357.7" font-size="26" font-weight="400" fill="#254653">current order</text><text x="836" y="395.4" font-size="26" font-weight="400" fill="#254653">Confirm transport and</text><text x="836" y="433.1" font-size="26" font-weight="400" fill="#254653">destination</text><text x="40" y="625" font-size="26" font-weight="400" fill="#254653">Radar and satellite add observation context.</text><text x="40" y="662.7" font-size="26" font-weight="400" fill="#254653">A missing source is unavailable, not an all-clear.</text></g></svg>
