<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title"><title id="title">Four records for a local check</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="40" y="64" font-size="42" font-weight="700" fill="#254653">Four records for a local check</text><text x="40" y="115" font-size="26" font-weight="400" fill="#254653">A city name or storm distance cannot complete these fields.</text><rect x="40" y="175" width="550" height="245" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="40" y="175" width="8" height="245" fill="#176b87"/><text x="64" y="223" font-size="30" font-weight="700" fill="#254653">1. Location</text><text x="64" y="285" font-size="27" font-weight="400" fill="#254653">Exact address and responsible county</text><text x="64" y="324.15" font-size="27" font-weight="400" fill="#254653">ZIP point is not an evacuation zone</text><rect x="620" y="175" width="550" height="245" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="620" y="175" width="8" height="245" fill="#39734a"/><text x="644" y="223" font-size="30" font-weight="700" fill="#254653">2. Weather message</text><text x="644" y="285" font-size="27" font-weight="400" fill="#254653">Issuer, affected area and valid time</text><text x="644" y="324.15" font-size="27" font-weight="400" fill="#254653">Keep the original warning link</text><rect x="40" y="465" width="550" height="245" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="40" y="465" width="8" height="245" fill="#ad5b23"/><text x="64" y="513" font-size="30" font-weight="700" fill="#254653">3. Local instruction</text><text x="64" y="575" font-size="27" font-weight="400" fill="#254653">Address lookup and current order</text><text x="64" y="614.15" font-size="27" font-weight="400" fill="#254653">A standing zone is not an active order</text><rect x="620" y="465" width="550" height="245" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="620" y="465" width="8" height="245" fill="#5a527c"/><text x="644" y="513" font-size="30" font-weight="700" fill="#254653">4. Arrangements</text><text x="644" y="575" font-size="27" font-weight="400" fill="#254653">Permitted route, ride and destination</text><text x="644" y="614.15" font-size="27" font-weight="400" fill="#254653">Requested is different from confirmed</text><text x="40" y="805" font-size="26" font-weight="400" fill="#254653">Planning diagram only: no zones, routes or current orders shown.</text><text x="40" y="842.7" font-size="26" font-weight="400" fill="#254653">Use the official resources linked in the guide.</text></g></svg>
