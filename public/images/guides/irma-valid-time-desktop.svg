<text x="64" y="875" font-size="29" fill="#006d70" font-weight="700">SAME VALID TIME: SEPTEMBER 6, 2017, 12:00 UTC</text>
<text x="64" y="933" font-size="40" fill="#006d70" font-weight="700">Forecast wind revised: 150 to 155 kt (+5 kt)</text>
<text x="64" y="982" font-size="27" >Forecast center: 0.1 degree west, from 63.0W to 63.1W; latitude remains 18.1N.</text>
<text x="64" y="1058" font-size="26" fill="#aa451e" font-weight="700">WHY NOT COMPARE BOTH 24H ROWS?</text>
