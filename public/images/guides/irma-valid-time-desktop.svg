<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" fill="#192e35"><title id="title">Irma (2017): Compare the Same Valid Time</title><desc id="desc">Historical Irma (AL112017), 2017. Discussion 26, issued September 5 at 15:00 UTC, has a 24H row for September 6 at 12:00 UTC predicting 150 kt at 18.1N, 63.0W. Discussion 28, issued September 6 at 03:00 UTC, has a 12H row for that same valid time predicting 155 kt at 18.1N, 63.1W. The forecast revision is +5 kt and 0.1 degree west, not observed intensification. Discussion 28&apos;s 24H row targets September 7 at 00:00 UTC, 12 hours later. Not a current forecast.</desc><rect width="1600" height="1320" fill="#fff"/>
<text x="64" y="54" font-size="23" fill="#006d70" font-weight="700">HURRICANEHUB / HISTORICAL FORECAST EXERCISE</text>
<text x="64" y="124" font-size="53" font-weight="700">Irma (2017): Compare the Same Valid Time</text>
<text x="64" y="183" font-size="34" >Match the valid time, not just the horizon label.</text>
<text x="64" y="229" font-size="27" fill="#4e6269">AL112017 | Transcribed from NHC Forecast Discussions 26 and 28.</text>
<path d="M800,272 L800,795" stroke="#cbd7db" fill="none" stroke-width="2"/>
