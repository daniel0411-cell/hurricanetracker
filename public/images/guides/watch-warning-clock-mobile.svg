<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1170" viewBox="0 0 720 1170" role="img" aria-labelledby="title"><title id="title">Hurricane watch and warning lead times share a tropical-storm-wind reference</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="36" y="65" font-size="40" font-weight="700" fill="#163e50">Watch / warning:</text><text x="36" y="121" font-size="40" font-weight="700" fill="#163e50">read the right clock</text><text x="36" y="195" font-size="29" font-weight="400" fill="#163e50">Usual issue lead times, not time left</text><path d="M70 290 H650" stroke="#176b87" stroke-width="5"/><path d="M70 278 V302" stroke="#176b87" stroke-width="5"/><path d="M215 278 V302" stroke="#176b87" stroke-width="5"/><path d="M650 278 V302" stroke="#176b87" stroke-width="5"/><text x="40" y="260" font-size="29" font-weight="700" fill="#163e50">−48 h</text><text x="185" y="260" font-size="29" font-weight="700" fill="#163e50">−36 h</text><text x="608" y="260" font-size="29" font-weight="700" fill="#163e50">0 h</text><text x="36" y="350" font-size="29" font-weight="700" fill="#163e50">0 h = anticipated tropical-storm-force</text><text x="36" y="390.6" font-size="29" font-weight="700" fill="#163e50">wind onset, NOT landfall</text><rect x="30" y="455" width="660" height="210" rx="14" fill="#e3f1f4" stroke="#91aebc"/><text x="54" y="505" font-size="32" font-weight="700" fill="#163e50">WATCH: possible</text><text x="54" y="565" font-size="28" font-weight="400" fill="#163e50">Hurricane conditions in the stated area</text><text x="54" y="604.2" font-size="28" font-weight="400" fill="#163e50">Usually issued 48 h before that onset</text><rect x="30" y="690" width="660" height="210" rx="14" fill="#fff0dc" stroke="#91aebc"/><text x="54" y="740" font-size="32" font-weight="700" fill="#163e50">WARNING: expected</text><text x="54" y="800" font-size="28" font-weight="400" fill="#163e50">Hurricane conditions in the stated area</text><text x="54" y="839.2" font-size="28" font-weight="400" fill="#163e50">Usually issued 36 h before that onset</text><text x="36" y="1000" font-size="29" font-weight="400" fill="#163e50">An old message does not restart the clock.</text><text x="36" y="1040.6" font-size="29" font-weight="400" fill="#163e50">Read the latest area and instructions.</text><text x="36" y="1081.2" font-size="29" font-weight="400" fill="#163e50">Local orders may require earlier action.</text></g></svg>
