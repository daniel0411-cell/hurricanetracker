<title id="title">Michael (2018): A 24-Hour Wind Increase</title><desc id="desc">Historical Michael (2018) NHC best-track entries: 90 kt at October 9 12:00 UTC, 100 kt at October 9 18:00 UTC, and 125 kt at October 10 12:00 UTC. The full 24-hour increase is 35 kt; the final 18-hour increase is 25 kt. Time spacing is proportional. Not a current forecast.</desc><rect width="1600" height="1000" fill="#fff"/>
<text x="64" y="54" font-size="23" fill="#006d70" font-weight="700">HURRICANEHUB / HISTORICAL READING EXERCISE</text>
