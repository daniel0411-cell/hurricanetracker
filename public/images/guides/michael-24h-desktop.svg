<text x="64" y="177" font-size="30" fill="#4e6269">NHC post-storm best-track analysis | AL142018</text>
<text x="64" y="223" font-size="28" fill="#4e6269">Maximum sustained wind (kt). All dates and times UTC.</text>
<text x="800" y="298" font-size="28" fill="#006d70" text-anchor="middle" font-weight="700">24 HOURS / FIRST TO LAST ENTRY</text>
<path d="M150 357 V326 H1450 V357" fill="none" stroke="#006d70" stroke-width="4"/>
<line x1="120" y1="466" x2="1480" y2="466" stroke="#a8b9bf" stroke-width="4" />
