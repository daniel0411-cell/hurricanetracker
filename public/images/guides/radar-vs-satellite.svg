<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">When to use hurricane radar and satellite imagery</title><desc id="desc">Satellite shows broad cloud structure over ocean while radar shows nearby precipitation and rain-band timing.</desc>
  <rect width="1200" height="675" fill="#f3f8fa"/><rect x="54" y="48" width="1092" height="579" rx="20" fill="#fff" stroke="#b7cbd4" stroke-width="2"/>
  <text x="94" y="112" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123849">Radar and satellite answer different questions</text><text x="94" y="151" font-family="Arial,sans-serif" font-size="21" fill="#496773">Compare both, then use official advisories and local alerts for decisions.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(92 196)"><rect width="493" height="325" rx="16" fill="#e7f3f7" stroke="#6ca1b5" stroke-width="2"/><circle cx="91" cy="86" r="42" fill="none" stroke="#217997" stroke-width="8"/><path d="M91 86 L132 61" stroke="#217997" stroke-width="7" stroke-linecap="round"/><path d="M91 86 A65 65 0 0 1 152 109" fill="none" stroke="#57a8c1" stroke-width="6"/><text x="32" y="168" font-size="28" font-weight="700" fill="#123849">WEATHER RADAR</text><text x="32" y="211" font-size="20" fill="#334f5a">Best near land and radar coverage</text><text x="32" y="248" font-size="18" fill="#334f5a">• Rain bands and precipitation</text><text x="32" y="279" font-size="18" fill="#334f5a">• Short-term movement and timing</text></g>
  <g transform="translate(615 196)"><rect width="493" height="325" rx="16" fill="#edf5ee" stroke="#79a184" stroke-width="2"/><rect x="53" y="46" width="74" height="58" rx="8" fill="none" stroke="#3c7950" stroke-width="7"/><path d="M90 104 v35 M62 139 h56 M45 52 L19 31 M135 52 l26-21" stroke="#3c7950" stroke-width="7" stroke-linecap="round"/><text x="32" y="168" font-size="28" font-weight="700" fill="#173f25">GOES SATELLITE</text><text x="32" y="211" font-size="20" fill="#385744">Best offshore and across the basin</text><text x="32" y="248" font-size="18" fill="#385744">• Cloud structure and organization</text><text x="32" y="279" font-size="18" fill="#385744">• Moisture and cold cloud tops</text></g></g>
  <text x="94" y="580" font-family="Arial,sans-serif" font-size="18" fill="#496773">Neither layer alone predicts landfall, surge or neighborhood impacts.</text>
</svg>
