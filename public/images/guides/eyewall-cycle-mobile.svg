<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" fill="#202d32">
    <title id="title">Hurricane eyewall replacement cycle</title><desc id="desc">Three conceptual stages of eyewall replacement. The original red inner ring is surrounded by a new teal outer ring. The red inner ring fades as the teal ring becomes the primary eyewall. Peak winds may weaken temporarily while the wind field broadens. This is not an observation or forecast, and is not to scale.</desc>
    <rect width="1080" height="1800" fill="#fff"/>
  <text x="64" y="60" font-size="30" fill="#52646b" font-weight="700">HURRICANEHUB / STORM STRUCTURE</text>
  <text x="64" y="133" font-size="62" font-weight="700">Hurricane eyewall</text>
  <text x="64" y="204" font-size="62" font-weight="700">replacement cycle</text>
  <text x="64" y="263" font-size="40" fill="#52646b">Peak winds may weaken temporarily;</text>
  <text x="64" y="313" font-size="40" fill="#52646b">the wind field may broaden.</text>
  <path d="M64,345 H1016" stroke="#cbd7db" stroke-width="2"/>
  <text x="64" y="402" font-size="36" fill="#52646b" font-weight="700">01</text>
    <text x="152" y="402" font-size="46" font-weight="700">Original eyewall</text>
    <g data-stage="1">
    <circle cx="280" cy="580" r="85" fill="#f0f5f6"/>
    <circle id="mobile-1-original" data-ring="original" cx="280" cy="580" r="90" fill="none" stroke="#c54a3f" stroke-width="10" />

    <text x="280" y="594" font-size="42" text-anchor="middle" font-weight="700">Eye</text><g data-label="mobile-1-original"><path d="M548,658 L490,658 L357.9422863405995,625" fill="none" stroke="#fff" stroke-width="6"/>
    <path d="M548,658 L490,658 L357.9422863405995,625" fill="none" stroke="#202d32" stroke-width="2"/>
    <circle data-leader-target="mobile-1-original" cx="357.9422863405995" cy="625" r="5" fill="#a6372e" stroke="#fff" stroke-width="2"/>
    <text x="574" y="642" font-size="42" fill="#a6372e" font-weight="700">Original</text><text x="574" y="692" font-size="42" fill="#a6372e" font-weight="700">eyewall</text></g></g><text x="64" y="800" font-size="36" fill="#52646b" font-weight="700">02</text>
    <text x="152" y="800" font-size="46" font-weight="700">Concentric eyewalls</text>
    <g data-stage="2">
    <circle cx="280" cy="978" r="85" fill="#f0f5f6"/>
    <circle id="mobile-2-original" data-ring="original" cx="280" cy="978" r="90" fill="none" stroke="#c54a3f" stroke-width="10" />
    <circle id="mobile-2-outer" data-ring="outer" cx="280" cy="978" r="158" fill="none" stroke="#007e83" stroke-width="12"/>
    <text x="280" y="992" font-size="42" text-anchor="middle" font-weight="700">Eye</text><g data-label="mobile-2-original"><path d="M548,1056 L490,1056 L357.9422863405995,1023" fill="none" stroke="#fff" stroke-width="6"/>
    <path d="M548,1056 L490,1056 L357.9422863405995,1023" fill="none" stroke="#202d32" stroke-width="2"/>
    <circle data-leader-target="mobile-2-original" cx="357.9422863405995" cy="1023" r="5" fill="#a6372e" stroke="#fff" stroke-width="2"/>
    <text x="574" y="1040" font-size="42" fill="#a6372e" font-weight="700">Inner</text><text x="574" y="1090" font-size="42" fill="#a6372e" font-weight="700">eyewall</text></g><g data-label="mobile-2-outer"><path d="M548,884 L490,884 L416.83201379794133,899" fill="none" stroke="#fff" stroke-width="6"/>
    <path d="M548,884 L490,884 L416.83201379794133,899" fill="none" stroke="#202d32" stroke-width="2"/>
    <circle data-leader-target="mobile-2-outer" cx="416.83201379794133" cy="899" r="5" fill="#00676b" stroke="#fff" stroke-width="2"/>
    <text x="574" y="868" font-size="42" fill="#00676b" font-weight="700">Outer</text><text x="574" y="918" font-size="42" fill="#00676b" font-weight="700">eyewall</text></g></g><text x="64" y="1198" font-size="36" fill="#52646b" font-weight="700">03</text>
    <text x="152" y="1198" font-size="46" font-weight="700">Outer eyewall takes over</text>
    <g data-stage="3">
    <circle cx="280" cy="1376" r="153" fill="#f0f5f6"/>
    <circle id="mobile-3-original" data-ring="original" cx="280" cy="1376" r="90" fill="none" stroke="#c54a3f" stroke-width="10" stroke-dasharray="10 10" opacity="0.55"/>
    <circle id="mobile-3-outer" data-ring="outer" cx="280" cy="1376" r="158" fill="none" stroke="#007e83" stroke-width="12"/>
    <text x="280" y="1390" font-size="42" text-anchor="middle" font-weight="700">Eye</text><g data-label="mobile-3-original"><path d="M548,1454 L490,1454 L357.9422863405995,1421" fill="none" stroke="#fff" stroke-width="6"/>
    <path d="M548,1454 L490,1454 L357.9422863405995,1421" fill="none" stroke="#202d32" stroke-width="2"/>
    <circle data-leader-target="mobile-3-original" cx="357.9422863405995" cy="1421" r="5" fill="#96554f" stroke="#fff" stroke-width="2"/>
    <text x="574" y="1438" font-size="42" fill="#96554f" font-weight="700">Fading inner</text><text x="574" y="1488" font-size="42" fill="#96554f" font-weight="700">eyewall</text></g><g data-label="mobile-3-outer"><path d="M548,1282 L490,1282 L416.83201379794133,1297" fill="none" stroke="#fff" stroke-width="6"/>
    <path d="M548,1282 L490,1282 L416.83201379794133,1297" fill="none" stroke="#202d32" stroke-width="2"/>
    <circle data-leader-target="mobile-3-outer" cx="416.83201379794133" cy="1297" r="5" fill="#00676b" stroke="#fff" stroke-width="2"/>
    <text x="574" y="1266" font-size="42" fill="#00676b" font-weight="700">Primary</text><text x="574" y="1316" font-size="42" fill="#00676b" font-weight="700">eyewall</text></g></g>
  <g fill="none" stroke="#74858c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M92,730 V750 M81,739 L92,750 L103,739"/><path d="M92,1137 V1153 M81,1142 L92,1153 L103,1142"/></g>
  <rect y="1560" width="1080" height="132" fill="#edf5f4"/>
  <text x="64" y="1612" font-size="42" font-weight="700">Lower peak winds do not</text>
  <text x="64" y="1666" font-size="42" font-weight="700">necessarily mean lower overall risk.</text>
  <text x="64" y="1736" font-size="36" fill="#52646b">Conceptual sequence, not observations</text>
  <text x="64" y="1782" font-size="36" fill="#52646b">or a forecast. Not to scale.</text>
</svg>
