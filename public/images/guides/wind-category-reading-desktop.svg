<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title"><title id="title">Saffir-Simpson wind thresholds; wind only, not local water depth</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#163e50">Hurricane wind categories</text><text x="36" y="120" font-size="29" font-weight="400" fill="#163e50">Maximum sustained wind only — not a complete hazard score</text><text x="42" y="196" font-size="32" font-weight="700" fill="#163e50">Category</text><text x="365" y="196" font-size="32" font-weight="700" fill="#163e50">mph</text><text x="720" y="196" font-size="32" font-weight="700" fill="#163e50">knots</text><rect x="30" y="220" width="1140" height="72" rx="10" fill="#e3f1f4"/><text x="60" y="268" font-size="34" font-weight="700" fill="#163e50">1</text><text x="365" y="268" font-size="32" font-weight="400" fill="#163e50">74–95</text><text x="720" y="268" font-size="32" font-weight="400" fill="#163e50">64–82</text><rect x="30" y="305" width="1140" height="72" rx="10" fill="#e3f1f4"/><text x="60" y="353" font-size="34" font-weight="700" fill="#163e50">2</text><text x="365" y="353" font-size="32" font-weight="400" fill="#163e50">96–110</text><text x="720" y="353" font-size="32" font-weight="400" fill="#163e50">83–95</text><rect x="30" y="390" width="1140" height="72" rx="10" fill="#fff0dc"/><text x="60" y="438" font-size="34" font-weight="700" fill="#163e50">3</text><text x="365" y="438" font-size="32" font-weight="400" fill="#163e50">111–129</text><text x="720" y="438" font-size="32" font-weight="400" fill="#163e50">96–112</text><rect x="30" y="475" width="1140" height="72" rx="10" fill="#fff0dc"/><text x="60" y="523" font-size="34" font-weight="700" fill="#163e50">4</text><text x="365" y="523" font-size="32" font-weight="400" fill="#163e50">130–156</text><text x="720" y="523" font-size="32" font-weight="400" fill="#163e50">113–136</text><rect x="30" y="560" width="1140" height="72" rx="10" fill="#fff0dc"/><text x="60" y="608" font-size="34" font-weight="700" fill="#163e50">5</text><text x="365" y="608" font-size="32" font-weight="400" fill="#163e50">157+</text><text x="720" y="608" font-size="32" font-weight="400" fill="#163e50">137+</text><text x="36" y="710" font-size="29" font-weight="400" fill="#163e50">Categories 3–5 are major hurricanes.</text><text x="36" y="750.6" font-size="29" font-weight="400" fill="#163e50">Surge, rain and tornado hazards need separate products and alerts.</text><text x="36" y="791.2" font-size="29" font-weight="400" fill="#163e50">No address-level damage prediction.</text></g></svg>
