<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Saffir-Simpson hurricane wind scale</title><desc id="desc">Category 1 through 5 wind thresholds in miles per hour with a warning that category measures wind only.</desc>
  <rect width="1200" height="675" fill="#f3f8fa"/><rect x="54" y="48" width="1092" height="579" rx="20" fill="#fff" stroke="#b7cbd4" stroke-width="2"/>
  <text x="94" y="116" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123849">Saffir-Simpson hurricane wind scale</text><text x="94" y="157" font-family="Arial,sans-serif" font-size="21" fill="#496773">Maximum sustained wind determines category. Major hurricanes are Category 3–5.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(92 215)"><rect width="196" height="210" rx="14" fill="#e8f3df"/><text x="98" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#294f24">CATEGORY 1</text><text x="98" y="119" text-anchor="middle" font-size="32" font-weight="700" fill="#294f24">74–95</text><text x="98" y="153" text-anchor="middle" font-size="20" fill="#294f24">mph</text></g>
  <g transform="translate(297 215)"><rect width="196" height="210" rx="14" fill="#fff4cb"/><text x="98" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#66500a">CATEGORY 2</text><text x="98" y="119" text-anchor="middle" font-size="32" font-weight="700" fill="#66500a">96–110</text><text x="98" y="153" text-anchor="middle" font-size="20" fill="#66500a">mph</text></g>
  <g transform="translate(502 215)"><rect width="196" height="210" rx="14" fill="#ffe3b8"/><text x="98" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#70420a">CATEGORY 3</text><text x="98" y="119" text-anchor="middle" font-size="32" font-weight="700" fill="#70420a">111–129</text><text x="98" y="153" text-anchor="middle" font-size="20" fill="#70420a">mph</text></g>
  <g transform="translate(707 215)"><rect width="196" height="210" rx="14" fill="#ffd0bd"/><text x="98" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#752b13">CATEGORY 4</text><text x="98" y="119" text-anchor="middle" font-size="32" font-weight="700" fill="#752b13">130–156</text><text x="98" y="153" text-anchor="middle" font-size="20" fill="#752b13">mph</text></g>
  <g transform="translate(912 215)"><rect width="196" height="210" rx="14" fill="#f4c5ca"/><text x="98" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#731c2b">CATEGORY 5</text><text x="98" y="119" text-anchor="middle" font-size="32" font-weight="700" fill="#731c2b">157+</text><text x="98" y="153" text-anchor="middle" font-size="20" fill="#731c2b">mph</text></g></g>
  <rect x="92" y="468" width="1016" height="108" rx="12" fill="#123849"/><text x="600" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Category measures wind only</text><text x="600" y="547" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d9e9ef">It does not measure storm surge, rainfall, tornadoes, storm size or duration.</text>
</svg>
