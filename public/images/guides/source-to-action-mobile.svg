<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1176" viewBox="0 0 720 1176" role="img" aria-labelledby="title"><title id="title">Match the question to the source</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="40" y="64" font-size="36" font-weight="700" fill="#254653">Match the question</text><text x="40" y="116.19999999999999" font-size="36" font-weight="700" fill="#254653">to the source</text><rect x="32" y="190" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="190" width="8" height="230" fill="#176b87"/><text x="56" y="238" font-size="30" font-weight="700" fill="#254653">NHC: storm context</text><text x="56" y="302" font-size="28" font-weight="400" fill="#254653">Basin, storm identifier and advisory time</text><text x="56" y="342.6" font-size="28" font-weight="400" fill="#254653">Position and forecast valid times</text><rect x="32" y="460" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="460" width="8" height="230" fill="#39734a"/><text x="56" y="508" font-size="30" font-weight="700" fill="#254653">NWS: local weather alerts</text><text x="56" y="572" font-size="28" font-weight="400" fill="#254653">Affected area, hazard and valid period</text><text x="56" y="612.6" font-size="28" font-weight="400" fill="#254653">Read the protective instruction</text><rect x="32" y="730" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="730" width="8" height="230" fill="#ad5b23"/><text x="56" y="778" font-size="30" font-weight="700" fill="#254653">Local authority: action</text><text x="56" y="842" font-size="28" font-weight="400" fill="#254653">Address, zone and current order</text><text x="56" y="882.6" font-size="28" font-weight="400" fill="#254653">Confirm transport and destination</text><text x="40" y="1005" font-size="24" font-weight="400" fill="#254653">Radar and satellite add observation</text><text x="40" y="1039.8" font-size="24" font-weight="400" fill="#254653">context.</text><text x="40" y="1074.6" font-size="24" font-weight="400" fill="#254653">A missing source is unavailable, not an</text><text x="40" y="1109.4" font-size="24" font-weight="400" fill="#254653">all-clear.</text></g></svg>
