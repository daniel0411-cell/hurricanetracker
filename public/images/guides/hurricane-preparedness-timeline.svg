<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hurricane preparedness timeline</title><desc id="desc">Preparedness actions from quiet weather through 72, 48, and 24 hours before expected impacts.</desc>
  <rect width="1200" height="675" fill="#f3f8fa"/><rect x="54" y="48" width="1092" height="579" rx="20" fill="#fff" stroke="#b7cbd4" stroke-width="2"/>
  <text x="94" y="115" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123849">Hurricane preparedness by time window</text><text x="94" y="154" font-family="Arial,sans-serif" font-size="21" fill="#496773">Local orders and hazard timing override this general planning sequence.</text>
  <line x1="150" y1="280" x2="1048" y2="280" stroke="#9bb0b9" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(170 280)"><circle r="35" fill="#39734a"/><text y="9" font-size="24" font-weight="700" fill="#fff">NOW</text><text y="82" font-size="24" font-weight="700" fill="#173f25">Quiet weather</text><text y="120" font-size="18" fill="#385744">Know your zone</text><text y="148" font-size="18" fill="#385744">Build supplies</text><text y="176" font-size="18" fill="#385744">Save contacts</text></g>
  <g transform="translate(460 280)"><circle r="35" fill="#176b87"/><text y="9" font-size="23" font-weight="700" fill="#fff">72H</text><text y="82" font-size="24" font-weight="700" fill="#123849">Confirm plans</text><text y="120" font-size="18" fill="#334f5a">Fuel and charge</text><text y="148" font-size="18" fill="#334f5a">Refill medicine</text><text y="176" font-size="18" fill="#334f5a">Review route</text></g>
  <g transform="translate(750 280)"><circle r="35" fill="#a66b06"/><text y="9" font-size="23" font-weight="700" fill="#fff">48H</text><text y="82" font-size="24" font-weight="700" fill="#60410b">Finish setup</text><text y="120" font-size="18" fill="#604e2d">Secure property</text><text y="148" font-size="18" fill="#604e2d">Pack go-bags</text><text y="176" font-size="18" fill="#604e2d">Move early if needed</text></g>
  <g transform="translate(1030 280)"><circle r="35" fill="#b54422"/><text y="9" font-size="23" font-weight="700" fill="#fff">24H</text><text y="82" font-size="24" font-weight="700" fill="#5b2515">Act safely</text><text y="120" font-size="18" fill="#673a2c">Follow orders</text><text y="148" font-size="18" fill="#673a2c">Stop travel early</text><text y="176" font-size="18" fill="#673a2c">Shelter securely</text></g></g>
  <rect x="92" y="520" width="1016" height="62" rx="10" fill="#123849"/><text x="600" y="559" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Check NHC forecasts, NWS alerts and local emergency instructions at every stage.</text>
</svg>
