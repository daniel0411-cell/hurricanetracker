<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Keep facts, tasks and replies separate</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="40" y="64" font-size="42" font-weight="700" fill="#254653">Keep facts, tasks and replies separate</text><text x="40" y="115" font-size="26" font-weight="400" fill="#254653">A blank household workflow, not an official emergency protocol.</text><rect x="40" y="175" width="350" height="350" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="40" y="175" width="8" height="350" fill="#176b87"/><text x="64" y="223" font-size="27" font-weight="700" fill="#254653">SOURCE FACT</text><text x="64" y="320" font-size="26" font-weight="400" fill="#254653">Issuer / original</text><text x="64" y="357.7" font-size="26" font-weight="400" fill="#254653">link / issue time</text><text x="64" y="395.4" font-size="26" font-weight="400" fill="#254653">Affected area / exact</text><text x="64" y="433.1" font-size="26" font-weight="400" fill="#254653">instruction</text><rect x="426" y="175" width="350" height="350" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="426" y="175" width="8" height="350" fill="#39734a"/><text x="450" y="223" font-size="27" font-weight="700" fill="#254653">HOUSEHOLD TASK</text><text x="450" y="320" font-size="26" font-weight="400" fill="#254653">Action / owner /</text><text x="450" y="357.7" font-size="26" font-weight="400" fill="#254653">backup contact</text><text x="450" y="395.4" font-size="26" font-weight="400" fill="#254653">Official deadline vs</text><text x="450" y="433.1" font-size="26" font-weight="400" fill="#254653">household check-in</text><rect x="812" y="175" width="350" height="350" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="812" y="175" width="8" height="350" fill="#ad5b23"/><text x="836" y="223" font-size="27" font-weight="700" fill="#254653">CONFIRMATION</text><text x="836" y="320" font-size="26" font-weight="400" fill="#254653">Unconfirmed /</text><text x="836" y="357.7" font-size="26" font-weight="400" fill="#254653">requested / confirmed</text><text x="836" y="395.4" font-size="26" font-weight="400" fill="#254653">Reply time /</text><text x="836" y="433.1" font-size="26" font-weight="400" fill="#254653">unresolved item /</text><text x="836" y="470.79999999999995" font-size="26" font-weight="400" fill="#254653">next check</text><text x="40" y="625" font-size="26" font-weight="400" fill="#254653">Keep contact, address and medical details private.</text><text x="40" y="662.7" font-size="26" font-weight="400" fill="#254653">Recording a task does not postpone urgent protective action.</text></g></svg>
