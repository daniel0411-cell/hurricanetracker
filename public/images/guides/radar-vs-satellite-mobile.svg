<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title"><title id="title">Radar and satellite answer different questions</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="36" y="65" font-size="38" font-weight="700" fill="#254653">Radar or satellite?</text><rect x="32" y="110" width="656" height="290" rx="16" fill="#e7f3f7"/><text x="60" y="165" font-size="34" font-weight="700" fill="#254653">RADAR</text><text x="60" y="225" font-size="28" font-weight="400" fill="#254653">Precipitation echoes near coverage</text><text x="60" y="265.6" font-size="28" font-weight="400" fill="#254653">Read the frame time and legend</text><text x="60" y="306.2" font-size="28" font-weight="400" fill="#254653">Not a complete hurricane forecast</text><rect x="32" y="435" width="656" height="290" rx="16" fill="#edf5ee"/><text x="60" y="490" font-size="34" font-weight="700" fill="#254653">SATELLITE</text><text x="60" y="550" font-size="28" font-weight="400" fill="#254653">Cloud structure, including offshore</text><text x="60" y="590.6" font-size="28" font-weight="400" fill="#254653">Read the product and frame time</text><text x="60" y="631.2" font-size="28" font-weight="400" fill="#254653">Not a surface wind measurement</text><text x="36" y="800" font-size="26" font-weight="400" fill="#254653">Compare official advisories and local alerts.</text><text x="36" y="837.7" font-size="26" font-weight="400" fill="#254653">Teaching comparison, not observed weather.</text></g></svg>
