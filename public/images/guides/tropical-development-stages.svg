<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tropical development stages from outlook area to named storm</title><desc id="desc">An NHC outlook area may receive an Invest identifier and could develop into a depression or named storm, but development is not guaranteed.</desc>
  <rect width="1200" height="675" fill="#f3f8fa"/><rect x="54" y="48" width="1092" height="579" rx="20" fill="#fff" stroke="#b7cbd4" stroke-width="2"/>
  <text x="94" y="112" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123849">From outlook area to named storm</text><text x="94" y="151" font-family="Arial,sans-serif" font-size="21" fill="#496773">Each step adds observations and official products. Development is never guaranteed.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(86 220)"><rect width="238" height="210" rx="16" fill="#fff6d9" stroke="#cfaa42" stroke-width="2"/><text x="24" y="46" font-size="20" font-weight="700" fill="#684d00">1 · OUTLOOK AREA</text><text x="24" y="88" font-size="18" fill="#594e2a">Formation potential</text><text x="24" y="119" font-size="18" fill="#594e2a">over 2 or 7 days</text><text x="24" y="169" font-size="16" fill="#594e2a">Not a forecast track</text></g><text x="337" y="338" font-size="38" fill="#78909a">→</text>
  <g transform="translate(370 220)"><rect width="238" height="210" rx="16" fill="#e7f3f7" stroke="#6ca1b5" stroke-width="2"/><text x="24" y="46" font-size="20" font-weight="700" fill="#123849">2 · INVEST</text><text x="24" y="88" font-size="18" fill="#334f5a">Operational ID for</text><text x="24" y="119" font-size="18" fill="#334f5a">added analysis</text><text x="24" y="169" font-size="16" fill="#334f5a">Not a classification</text></g><text x="621" y="338" font-size="38" fill="#78909a">→</text>
  <g transform="translate(654 220)"><rect width="238" height="210" rx="16" fill="#dfeff5" stroke="#5f9db5" stroke-width="2"/><text x="24" y="46" font-size="20" font-weight="700" fill="#123849">3 · DEPRESSION</text><text x="24" y="88" font-size="18" fill="#334f5a">Closed circulation;</text><text x="24" y="119" font-size="18" fill="#334f5a">NHC advisories begin</text><text x="24" y="169" font-size="16" fill="#334f5a">Official forecast track</text></g><text x="905" y="338" font-size="38" fill="#78909a">→</text>
  <g transform="translate(938 220)"><rect width="176" height="210" rx="16" fill="#fff0e9" stroke="#d98a70" stroke-width="2"/><text x="20" y="46" font-size="18" font-weight="700" fill="#6e2d19">4 · NAMED</text><text x="20" y="88" font-size="17" fill="#63382c">Tropical storm</text><text x="20" y="119" font-size="17" fill="#63382c">or hurricane</text><text x="20" y="169" font-size="15" fill="#63382c">Recurring advisories</text></g></g>
  <path d="M112 500 H1088" stroke="#b7cbd4" stroke-width="2" stroke-dasharray="8 8"/><text x="94" y="560" font-family="Arial,sans-serif" font-size="18" fill="#496773">A disturbance can weaken or disappear at any stage. Follow the latest NHC outlook and advisories.</text>
</svg>
