<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tropical development terms and Potential Tropical Cyclones</title><desc id="desc">These terms are not mandatory sequential stages. Potential Tropical Cyclone advisories can begin before formation.</desc>
  <rect width="1200" height="675" fill="#f3f8fa"/><rect x="54" y="48" width="1092" height="579" rx="20" fill="#fff" stroke="#b7cbd4" stroke-width="2"/>
  <text x="94" y="112" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123849">Tropical development terms</text><text x="94" y="151" font-family="Arial,sans-serif" font-size="21" fill="#496773">Not mandatory sequential stages. A disturbance may never become a cyclone.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(86 220)"><rect width="238" height="210" rx="8" fill="#fff6d9" stroke="#cfaa42" stroke-width="2"/><text x="24" y="46" font-size="20" font-weight="700" fill="#684d00">OUTLOOK AREA</text><text x="24" y="88" font-size="18" fill="#594e2a">Formation potential</text><text x="24" y="119" font-size="18" fill="#594e2a">over 2 or 7 days</text><text x="24" y="169" font-size="16" fill="#594e2a">Not a forecast track</text></g>
  <g transform="translate(370 220)"><rect width="238" height="210" rx="8" fill="#e7f3f7" stroke="#6ca1b5" stroke-width="2"/><text x="24" y="46" font-size="20" font-weight="700" fill="#123849">INVEST</text><text x="24" y="88" font-size="18" fill="#334f5a">Operational ID for</text><text x="24" y="119" font-size="18" fill="#334f5a">added analysis</text><text x="24" y="169" font-size="16" fill="#334f5a">Not a classification</text></g>
  <g transform="translate(654 220)"><rect width="238" height="210" rx="8" fill="#dfeff5" stroke="#5f9db5" stroke-width="2"/><text x="24" y="46" font-size="20" font-weight="700" fill="#123849">DEPRESSION</text><text x="24" y="88" font-size="18" fill="#334f5a">Closed circulation;</text><text x="24" y="119" font-size="18" fill="#334f5a">below storm strength</text><text x="24" y="169" font-size="16" fill="#334f5a">Receives advisories</text></g>
  <g transform="translate(938 220)"><rect width="176" height="210" rx="8" fill="#fff0e9" stroke="#d98a70" stroke-width="2"/><text x="20" y="46" font-size="18" font-weight="700" fill="#6e2d19">NAMED</text><text x="20" y="88" font-size="17" fill="#63382c">Tropical storm</text><text x="20" y="119" font-size="17" fill="#63382c">or hurricane</text><text x="20" y="169" font-size="15" fill="#63382c">Receives advisories</text></g></g>
  <g font-family="Arial,sans-serif" fill="#496773"><text x="94" y="488" font-size="23" font-weight="700">Potential Tropical Cyclone: advisories before formation</text><text x="94" y="526" font-size="20">Not yet a cyclone, but threatening tropical-storm or hurricane conditions</text><text x="94" y="558" font-size="20">over land within 72 hours. Check NHC advisories and applicable warnings.</text><text x="94" y="599" font-size="17">Source: NHC glossary, checked November 9, 2026. This is not a current-threat map.</text></g>
</svg>
