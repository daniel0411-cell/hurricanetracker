<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1176" viewBox="0 0 720 1176" role="img" aria-labelledby="title"><title id="title">Keep facts, tasks and replies separate</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="40" y="64" font-size="36" font-weight="700" fill="#254653">Keep facts, tasks and</text><text x="40" y="116.19999999999999" font-size="36" font-weight="700" fill="#254653">replies separate</text><rect x="32" y="190" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="190" width="8" height="230" fill="#176b87"/><text x="56" y="238" font-size="30" font-weight="700" fill="#254653">SOURCE FACT</text><text x="56" y="302" font-size="28" font-weight="400" fill="#254653">Issuer / original link / issue time</text><text x="56" y="342.6" font-size="28" font-weight="400" fill="#254653">Affected area / exact instruction</text><rect x="32" y="460" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="460" width="8" height="230" fill="#39734a"/><text x="56" y="508" font-size="30" font-weight="700" fill="#254653">HOUSEHOLD TASK</text><text x="56" y="572" font-size="28" font-weight="400" fill="#254653">Action / owner / backup contact</text><text x="56" y="612.6" font-size="28" font-weight="400" fill="#254653">Official deadline vs household check-in</text><rect x="32" y="730" width="656" height="230" rx="14" fill="#fff" stroke="#9bb8c4" stroke-width="2"/><rect x="32" y="730" width="8" height="230" fill="#ad5b23"/><text x="56" y="778" font-size="30" font-weight="700" fill="#254653">CONFIRMATION</text><text x="56" y="842" font-size="28" font-weight="400" fill="#254653">Unconfirmed / requested / confirmed</text><text x="56" y="882.6" font-size="28" font-weight="400" fill="#254653">Reply time / unresolved item / next check</text><text x="40" y="1005" font-size="24" font-weight="400" fill="#254653">Keep contact, address and medical details</text><text x="40" y="1039.8" font-size="24" font-weight="400" fill="#254653">private.</text><text x="40" y="1074.6" font-size="24" font-weight="400" fill="#254653">Recording a task does not postpone urgent</text><text x="40" y="1109.4" font-size="24" font-weight="400" fill="#254653">protective action.</text></g></svg>
