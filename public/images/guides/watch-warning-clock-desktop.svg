<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title"><title id="title">Hurricane watch and warning lead times share a tropical-storm-wind reference</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="36" y="65" font-size="44" font-weight="700" fill="#163e50">Watch / warning: read the right clock</text><text x="36" y="125" font-size="29" font-weight="400" fill="#163e50">Usual issue lead times before anticipated tropical-storm-force winds</text><path d="M70 260 H1130" stroke="#176b87" stroke-width="5"/><path d="M70 248 V272" stroke="#176b87" stroke-width="5"/><path d="M335 248 V272" stroke="#176b87" stroke-width="5"/><path d="M1130 248 V272" stroke="#176b87" stroke-width="5"/><text x="40" y="230" font-size="29" font-weight="700" fill="#163e50">−48 h</text><text x="305" y="230" font-size="29" font-weight="700" fill="#163e50">−36 h</text><text x="1088" y="230" font-size="29" font-weight="700" fill="#163e50">0 h</text><text x="36" y="320" font-size="30" font-weight="700" fill="#163e50">0 h = anticipated tropical-storm-force wind onset, NOT landfall</text><rect x="30" y="390" width="555" height="245" rx="14" fill="#e3f1f4" stroke="#91aebc"/><text x="54" y="440" font-size="32" font-weight="700" fill="#163e50">WATCH: possible</text><text x="54" y="500" font-size="26" font-weight="400" fill="#163e50">Hurricane conditions in the stated area</text><text x="54" y="536.4" font-size="26" font-weight="400" fill="#163e50">Usually issued 48 h before that onset</text><rect x="615" y="390" width="555" height="245" rx="14" fill="#fff0dc" stroke="#91aebc"/><text x="639" y="440" font-size="32" font-weight="700" fill="#163e50">WARNING: expected</text><text x="639" y="500" font-size="26" font-weight="400" fill="#163e50">Hurricane conditions in the stated area</text><text x="639" y="536.4" font-size="26" font-weight="400" fill="#163e50">Usually issued 36 h before that onset</text><text x="36" y="720" font-size="29" font-weight="400" fill="#163e50">An old message does not restart the clock. Read the latest area and instructions.</text><text x="36" y="760.6" font-size="29" font-weight="400" fill="#163e50">Local evacuation orders may require earlier action; this is not a travel deadline.</text></g></svg>
