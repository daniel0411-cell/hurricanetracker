<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hurricane information decision path</title><desc id="desc">Four steps from the official NHC track through radar and satellite, local alerts, and household action.</desc>
  <rect width="1200" height="675" fill="#f3f8fa"/><rect x="54" y="48" width="1092" height="579" rx="20" fill="#fff" stroke="#b7cbd4" stroke-width="2"/>
  <text x="94" y="115" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123849">From storm position to a local decision</text>
  <text x="94" y="154" font-family="Arial,sans-serif" font-size="21" fill="#496773">Use each source for the question it can answer.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(92 215)"><rect width="228" height="255" rx="14" fill="#e7f3f7" stroke="#6ca1b5"/><circle cx="42" cy="43" r="22" fill="#176b87"/><text x="42" y="51" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="24" y="96" font-size="25" font-weight="700" fill="#123849">NHC track</text><text x="24" y="134" font-size="18" fill="#334f5a">Position, intensity,</text><text x="24" y="163" font-size="18" fill="#334f5a">forecast cone and</text><text x="24" y="192" font-size="18" fill="#334f5a">advisory time</text></g>
  <text x="338" y="350" font-size="34" fill="#d55d36">→</text>
  <g transform="translate(373 215)"><rect width="228" height="255" rx="14" fill="#edf5ee" stroke="#79a184"/><circle cx="42" cy="43" r="22" fill="#39734a"/><text x="42" y="51" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="24" y="96" font-size="25" font-weight="700" fill="#173f25">Observe</text><text x="24" y="134" font-size="18" fill="#385744">Radar shows rain.</text><text x="24" y="163" font-size="18" fill="#385744">Satellite shows</text><text x="24" y="192" font-size="18" fill="#385744">cloud structure.</text></g>
  <text x="619" y="350" font-size="34" fill="#d55d36">→</text>
  <g transform="translate(654 215)"><rect width="228" height="255" rx="14" fill="#fff5df" stroke="#d9a84e"/><circle cx="42" cy="43" r="22" fill="#a66b06"/><text x="42" y="51" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="24" y="96" font-size="25" font-weight="700" fill="#60410b">Local alerts</text><text x="24" y="134" font-size="18" fill="#604e2d">NWS warnings and</text><text x="24" y="163" font-size="18" fill="#604e2d">local emergency</text><text x="24" y="192" font-size="18" fill="#604e2d">instructions</text></g>
  <text x="900" y="350" font-size="34" fill="#d55d36">→</text>
  <g transform="translate(935 215)"><rect width="173" height="255" rx="14" fill="#fbece7" stroke="#cf7658"/><circle cx="42" cy="43" r="22" fill="#b54422"/><text x="42" y="51" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="24" y="96" font-size="25" font-weight="700" fill="#5b2515">Act</text><text x="24" y="134" font-size="16" fill="#673a2c">Prepare or shelter,</text><text x="24" y="163" font-size="16" fill="#673a2c">or leave when</text><text x="24" y="192" font-size="16" fill="#673a2c">officially directed.</text></g></g>
  <rect x="92" y="518" width="1016" height="63" rx="10" fill="#123849"/><text x="600" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Maps provide context. Official local alerts control life-safety decisions.</text>
</svg>
