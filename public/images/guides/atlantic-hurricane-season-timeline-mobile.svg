<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title"><title id="title">Atlantic season dates and historical peak; not a current forecast</title><rect width="100%" height="100%" fill="#f3f8fa"/><g font-family="Arial, sans-serif"><text x="36" y="65" font-size="38" font-weight="700" fill="#254653">Atlantic season timing</text><text x="36" y="125" font-size="30" font-weight="400" fill="#254653">June 1 through November 30</text><path d="M65 360 H655" stroke="#176b87" stroke-width="6"/><text x="49" y="410" font-size="24" font-weight="400" fill="#254653">JUN</text><text x="156" y="410" font-size="24" font-weight="400" fill="#254653">JUL</text><text x="263" y="410" font-size="24" font-weight="400" fill="#254653">AUG</text><text x="370" y="410" font-size="24" font-weight="400" fill="#254653">SEP</text><text x="477" y="410" font-size="24" font-weight="400" fill="#254653">OCT</text><text x="584" y="410" font-size="24" font-weight="400" fill="#254653">NOV</text><path d="M405 345 V255" stroke="#ad5b23" stroke-width="4"/><text x="230" y="220" font-size="25" font-weight="700" fill="#254653">Historical peak: near September 10</text><rect x="32" y="485" width="656" height="265" rx="16" fill="#fff" stroke="#9bb8c4"/><text x="58" y="540" font-size="32" font-weight="700" fill="#254653">Timing is climate context</text><text x="58" y="602" font-size="27" font-weight="400" fill="#254653">Not this year’s storm count</text><text x="58" y="641.15" font-size="27" font-weight="400" fill="#254653">Not a current formation forecast</text><text x="58" y="680.3" font-size="27" font-weight="400" fill="#254653">Activity can occur outside these dates</text></g></svg>
