<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Aerial view of a coastal neighborhood with rising storm surge water flooding streets while a hurricane approaches offshore under dark clouds.">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="45%" stop-color="#2d3a4f"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="floodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3182ce" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2c5282" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Distant coastline -->
  <path d="M0 380 Q300 360 600 370 T1200 360 L1200 630 L0 630 Z" fill="#2d3748"/>

  <!-- Ocean -->
  <path d="M0 420 Q400 405 800 415 T1200 400 L1200 630 L0 630 Z" fill="url(#waterGradient)"/>

  <!-- Flooded neighborhood -->
  <g transform="translate(80, 320)">
    <!-- Street grid -->
    <rect x="120" y="120" width="80" height="200" fill="#4a5568"/>
    <rect x="0" y="200" width="400" height="60" fill="#4a5568"/>
    <rect x="300" y="100" width="70" height="220" fill="#4a5568"/>

    <!-- Houses -->
    <g transform="translate(30, 120)">
      <rect x="0" y="40" width="70" height="55" fill="#c53030"/>
      <path d="M-5 40 L35 5 L75 40 Z" fill="#742a2a"/>
      <rect x="10" y="55" width="18" height="18" fill="#ecc94b"/>
      <rect x="42" y="55" width="18" height="18" fill="#ecc94b"/>
    </g>
    <g transform="translate(220, 100)">
      <rect x="0" y="50" width="80" height="60" fill="#dd6b20"/>
      <path d="M-5 50 L40 15 L85 50 Z" fill="#9c4221"/>
      <rect x="12" y="68" width="20" height="22" fill="#fbd38d"/>
      <rect x="48" y="68" width="20" height="22" fill="#fbd38d"/>
    </g>
    <g transform="translate(380, 140)">
      <rect x="0" y="35" width="65" height="50" fill="#38a169"/>
      <path d="M-5 35 L32 5 L70 35 Z" fill="#276749"/>
      <rect x="10" y="50" width="16" height="16" fill="#bee3f8"/>
      <rect x="39" y="50" width="16" height="16" fill="#bee3f8"/>
    </g>
    <g transform="translate(150, 260)">
      <rect x="0" y="35" width="75" height="50" fill="#805ad5"/>
      <path d="M-5 35 L37 5 L80 35 Z" fill="#553c9a"/>
      <rect x="12" y="50" width="18" height="18" fill="#e9d8fd"/>
      <rect x="45" y="50" width="18" height="18" fill="#e9d8fd"/>
    </g>
    <g transform="translate(320, 250)">
      <rect x="0" y="40" width="70" height="55" fill="#319795"/>
      <path d="M-5 40 L35 10 L75 40 Z" fill="#234e52"/>
      <rect x="10" y="55" width="18" height="18" fill="#e6fffa"/>
      <rect x="42" y="55" width="18" height="18" fill="#e6fffa"/>
    </g>

    <!-- Flood water overlay -->
    <path d="M-20 180 Q100 170 220 185 T460 175 L460 360 L-20 360 Z" fill="url(#floodGradient)"/>

    <!-- Submerged car -->
    <g transform="translate(160, 195)">
      <path d="M0 15 Q0 0 20 0 L50 0 Q70 0 70 15 L70 25 L0 25 Z" fill="#e53e3e"/>
      <rect x="10" y="8" width="12" height="8" fill="#bee3f8"/>
      <rect x="45" y="8" width="12" height="8" fill="#bee3f8"/>
      <circle cx="18" cy="25" r="7" fill="#1a202c"/>
      <circle cx="52" cy="25" r="7" fill="#1a202c"/>
    </g>

    <!-- Floating debris -->
    <ellipse cx="360" cy="210" rx="25" ry="6" fill="#744210" opacity="0.8"/>
    <rect x="340" y="205" width="40" height="5" fill="#975a16" opacity="0.8"/>
  </g>

  <!-- Hurricane spiral -->
  <g transform="translate(920, 150)">
    <circle cx="0" cy="0" r="45" fill="#1a202c" opacity="0.6"/>
    <path d="M0 0" stroke="none" fill="none"/>
    <g stroke="#cbd5e0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M15 -25 Q45 -45 65 -15 Q85 25 50 55 Q10 80 -35 55 Q-75 25 -65 -25 Q-55 -75 5 -85 Q65 -95 95 -45"/>
      <path d="M35 -10 Q55 -25 65 5 Q75 35 45 50 Q15 65 -15 45 Q-45 25 -40 -10 Q-35 -45 5 -55 Q45 -65 70 -35"/>
    </g>
    <circle cx="0" cy="0" r="18" fill="#1a202c" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#e2e8f0"/>
  </g>

  <!-- Dark clouds -->
  <g fill="#1a202c" opacity="0.85" filter="url(#cloudShadow)">
    <ellipse cx="180" cy="90" rx="140" ry="55"/>
    <ellipse cx="360" cy="110" rx="120" ry="50"/>
    <ellipse cx="520" cy="80" rx="160" ry="65"/>
    <ellipse cx="750" cy="100" rx="130" ry="55"/>
    <ellipse cx="950" cy="75" rx="150" ry="60"/>
    <ellipse cx="1080" cy="120" rx="110" ry="45"/>
  </g>
  <g fill="#2d3748" opacity="0.6">
    <ellipse cx="260" cy="130" rx="100" ry="40"/>
    <ellipse cx="640" cy="140" rx="120" ry="45"/>
    <ellipse cx="1020" cy="135" rx="110" ry="42"/>
  </g>

  <!-- Rain streaks -->
  <g stroke="#a0aec0" stroke-width="1.5" opacity="0.35">
    <line x1="200" y1="160" x2="180" y2="240"/>
    <line x1="350" y1="150" x2="330" y2="230"/>
    <line x1="500" y1="170" x2="480" y2="250"/>
    <line x1="700" y1="155" x2="680" y2="235"/>
    <line x1="880" y1="165" x2="860" y2="245"/>
    <line x1="1050" y1="150" x2="1030" y2="230"/>
    <line x1="150" y1="180" x2="130" y2="260"/>
    <line x1="600" y1="185" x2="580" y2="265"/>
    <line x1="1150" y1="175" x2="1130" y2="255"/>
  </g>

  <!-- Evacuation sign -->
  <g transform="translate(980, 480)">
    <rect x="0" y="0" width="160" height="80" rx="6" fill="#c53030" stroke="#fff" stroke-width="4"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">EVACUATION</text>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">ROUTE</text>
    <polygon points="140,25 155,40 140,55" fill="#fff"/>
  </g>

  <!-- Water texture lines -->
  <g stroke="#63b3ed" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M40 520 Q120 510 200 520 T360 515"/>
    <path d="M500 540 Q600 530 700 540 T900 535"/>
    <path d="M100 580 Q250 570 400 580 T700 575"/>
    <path d="M800 560 Q920 550 1040 560 T1180 555"/>
  </g>

  <!-- Title overlay for blog preview -->
  <rect x="40" y="40" width="520" height="70" rx="8" fill="#1a202c" opacity="0.75"/>
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff">Storm Surge Forecasting</text>
</svg>