<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Measuring hurricane distance from your location</title>
  <desc id="desc">A map with a location pin and a hurricane spiral connected by a dashed distance line with a mile measurement.</desc>
  <rect width="1600" height="900" fill="#e9f1f2"/>
  <rect x="120" y="120" width="1360" height="660" rx="24" fill="#f4f8f8" stroke="#cddedf" stroke-width="6"/>
  <g stroke="#dbe7e8" stroke-width="3">
    <line x1="120" y1="290" x2="1480" y2="290"/>
    <line x1="120" y1="450" x2="1480" y2="450"/>
    <line x1="120" y1="610" x2="1480" y2="610"/>
    <line x1="400" y1="120" x2="400" y2="780"/>
    <line x1="800" y1="120" x2="800" y2="780"/>
    <line x1="1200" y1="120" x2="1200" y2="780"/>
  </g>
  <g transform="translate(1180,270)">
    <circle r="120" fill="#cfeeff" opacity=".55"/>
    <path d="M0 0 C40 -10 70 20 60 60 C50 100 -10 110 -40 80 C-70 50 -50 -10 -10 -20" fill="none" stroke="#0e6f8f" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g transform="translate(360,640)">
    <path d="M0 0 C-55 -70 -55 -150 0 -150 C55 -150 55 -70 0 0 Z" fill="#c1442e"/>
    <circle cx="0" cy="-100" r="34" fill="#fff"/>
  </g>
  <line x1="360" y1="640" x2="1180" y2="270" stroke="#20384d" stroke-width="8" stroke-dasharray="18 18"/>
  <rect x="690" y="420" width="240" height="70" rx="35" fill="#20384d"/>
  <text x="810" y="468" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">320 mi</text>
</svg>
