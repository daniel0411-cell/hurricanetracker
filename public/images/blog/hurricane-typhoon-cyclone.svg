<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hurricane vs typhoon vs cyclone around the world</title>
  <desc id="desc">A simplified world map showing three tropical cyclone basins: Atlantic and Northeast Pacific called hurricanes, Northwest Pacific called typhoons, and South Pacific and Indian Ocean called cyclones.</desc>
  <rect width="1600" height="900" fill="#e8eef0"/>
  <rect x="0" y="0" width="1600" height="900" fill="#1a2a35"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#oceanGrad)"/>
  <defs>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a35" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#1a2a35" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <path d="M100 350 C180 300 260 320 340 340 C420 360 480 330 560 360 C620 380 680 360 760 380 L760 560 C680 540 620 560 560 540 C480 520 420 550 340 530 C260 510 180 530 100 500 Z" fill="#3a5560" opacity=".8"/>
  <path d="M680 380 C760 360 840 380 920 360 C1000 340 1080 370 1160 350 C1240 330 1320 360 1400 340 C1480 320 1540 350 1600 330 L1600 600 C1540 620 1480 590 1400 610 C1320 630 1240 600 1160 620 C1080 640 1000 610 920 630 C840 650 760 630 680 650 Z" fill="#3a5560" opacity=".8"/>
  <path d="M100 600 C160 580 220 600 300 580 C380 560 440 590 520 570 L520 780 C440 800 380 770 300 790 C220 810 160 790 100 810 Z" fill="#3a5560" opacity=".8"/>
  <path d="M900 640 C960 620 1040 640 1120 620 C1200 600 1280 630 1360 610 L1360 820 C1280 840 1200 810 1120 830 C1040 850 960 830 900 850 Z" fill="#3a5560" opacity=".8"/>
  <g transform="translate(220,250)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#c1442e" stroke-width="8" opacity=".7"/>
    <circle cx="0" cy="0" r="28" fill="#c1442e" opacity=".5"/>
    <circle cx="0" cy="0" r="10" fill="#c1442e"/>
    <text x="0" y="90" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#c1442e" text-anchor="middle">Hurricane</text>
    <text x="0" y="120" font-family="Arial,sans-serif" font-size="18" fill="#c8d8de" text-anchor="middle">Atlantic &amp;</text>
    <text x="0" y="145" font-family="Arial,sans-serif" font-size="18" fill="#c8d8de" text-anchor="middle">Northeast Pacific</text>
    <text x="0" y="175" font-family="Arial,sans-serif" font-size="16" fill="#8fb4bf" text-anchor="middle">Jun-Nov (Atlantic)</text>
  </g>
  <g transform="translate(1180,250)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#c9891a" stroke-width="8" opacity=".7"/>
    <circle cx="0" cy="0" r="28" fill="#c9891a" opacity=".5"/>
    <circle cx="0" cy="0" r="10" fill="#c9891a"/>
    <text x="0" y="90" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#c9891a" text-anchor="middle">Typhoon</text>
    <text x="0" y="120" font-family="Arial,sans-serif" font-size="18" fill="#c8d8de" text-anchor="middle">Northwest</text>
    <text x="0" y="145" font-family="Arial,sans-serif" font-size="18" fill="#c8d8de" text-anchor="middle">Pacific</text>
    <text x="0" y="175" font-family="Arial,sans-serif" font-size="16" fill="#8fb4bf" text-anchor="middle">Year-round peak Aug-Oct</text>
  </g>
  <g transform="translate(700,700)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2f7d4f" stroke-width="8" opacity=".7"/>
    <circle cx="0" cy="0" r="28" fill="#2f7d4f" opacity=".5"/>
    <circle cx="0" cy="0" r="10" fill="#2f7d4f"/>
    <text x="0" y="-80" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#2f7d4f" text-anchor="middle">Cyclone</text>
    <text x="0" y="-50" font-family="Arial,sans-serif" font-size="18" fill="#c8d8de" text-anchor="middle">South Pacific &amp; Indian Ocean</text>
    <text x="0" y="-22" font-family="Arial,sans-serif" font-size="16" fill="#8fb4bf" text-anchor="middle">Nov-Apr (Southern Hemisphere)</text>
  </g>
  <text x="800" y="60" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#c8d8de" text-anchor="middle">Same Storm, Different Name</text>
  <text x="800" y="90" font-family="Arial,sans-serif" font-size="18" fill="#8fb4bf" text-anchor="middle">All are tropical cyclones — the name depends on where they form</text>
</svg>
