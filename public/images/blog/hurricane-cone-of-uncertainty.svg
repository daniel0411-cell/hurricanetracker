<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hurricane forecast cone of uncertainty</title>
  <desc id="desc">A stylized coastal map with a hurricane track and a widening forecast cone showing increasing uncertainty farther into the future.</desc>
  <rect width="1600" height="900" fill="#dcecef"/>
  <rect x="0" y="0" width="1600" height="320" fill="#b9d2d9"/>
  <path d="M0 260 C280 200 480 280 760 220 C1060 155 1280 240 1600 185 L1600 320 L0 320 Z" fill="#8fb4bf" opacity=".7"/>
  <rect x="0" y="420" width="1600" height="480" fill="#d4c8b6"/>
  <g opacity=".12">
    <path d="M200 420 L200 900 M400 420 L400 900 M600 420 L600 900 M800 420 L800 900 M1000 420 L1000 900 M1200 420 L1200 900 M1400 420 L1400 900" stroke="#20384d" stroke-width="2"/>
    <path d="M0 500 L1600 500 M0 600 L1600 600 M0 700 L1600 700 M0 800 L1600 800" stroke="#20384d" stroke-width="2"/>
  </g>
  <path d="M320 790 L1180 300" stroke="#20384d" stroke-width="6" stroke-dasharray="14 14" opacity=".5"/>
  <path d="M280 720 L360 760 L480 700 L620 620 L780 520 L950 410 L1120 300 L1220 235 L1160 290 L990 400 L820 510 L660 610 L520 690 L400 740 L320 700 L280 720 Z" fill="#c9891a" opacity=".35" stroke="#c9891a" stroke-width="3"/>
  <circle cx="320" cy="790" r="18" fill="#2f7d4f"/>
  <circle cx="480" cy="700" r="16" fill="#0e6f8f"/>
  <circle cx="620" cy="620" r="16" fill="#0e6f8f"/>
  <circle cx="780" cy="520" r="16" fill="#0e6f8f"/>
  <circle cx="950" cy="410" r="16" fill="#c1442e"/>
  <circle cx="1120" cy="300" r="16" fill="#c1442e"/>
  <circle cx="1180" cy="300" r="38" fill="#c1442e" opacity=".85"/>
  <g fill="none" stroke="#c1442e" stroke-width="4" opacity=".6">
    <circle cx="1180" cy="300" r="52"/>
    <circle cx="1180" cy="300" r="70"/>
    <circle cx="1180" cy="300" r="90"/>
  </g>
  <circle cx="1360" cy="740" r="10" fill="#20384d"/>
  <circle cx="1460" cy="760" r="14" fill="#c1442e" opacity=".7"/>
</svg>
