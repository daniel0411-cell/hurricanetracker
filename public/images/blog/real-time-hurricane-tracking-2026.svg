  <rect x="120" y="100" width="1000" height="620" rx="12" fill="url(#ocean)"/>
  <rect x="120" y="100" width="1000" height="620" rx="12" fill="none" stroke="#1a5078" stroke-width="2" opacity=".6"/>
  <g stroke="#1a6088" stroke-width="1" opacity=".3" fill="none">
