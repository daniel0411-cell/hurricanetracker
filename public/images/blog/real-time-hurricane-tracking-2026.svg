<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Real-time hurricane tracking dashboard with satellite and radar</title>
  <desc id="desc">Editorial illustration of a live hurricane tracking screen showing satellite imagery, radar sweep, forecast cone, and alert indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0a1e2e"/><stop offset=".5" stop-color="#103050"/><stop offset="1" stop-color="#0a1e2e"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0d2336"/><stop offset="1" stop-color="#081828"/></linearGradient>
    <linearGradient id="ocean" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0e3a5c"/><stop offset=".6" stop-color="#1a5078"/><stop offset="1" stop-color="#0e3a5c"/></linearGradient>
    <linearGradient id="cone" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f5b942" stop-opacity=".05"/><stop offset=".5" stop-color="#f5b942" stop-opacity=".25"/><stop offset="1" stop-color="#e8743c" stop-opacity=".05"/></linearGradient>
    <radialGradient id="radarSweep" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4dd07a" stop-opacity=".35"/><stop offset="1" stop-color="#4dd07a" stop-opacity="0"/></radialGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1a1a2e"/><stop offset=".4" stop-color="#2a3a5e"/><stop offset="1" stop-color="#1a1a2e"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
