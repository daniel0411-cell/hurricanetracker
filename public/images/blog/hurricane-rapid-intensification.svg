<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hurricane rapid intensification</title>
  <desc id="desc">Three stages of a hurricane growing from a weak tropical swirl to a major hurricane, beside a wind-speed graph showing a sudden rapid-intensification jump.</desc>
  <rect width="1600" height="900" fill="#edf4f5"/>
  <rect x="0" y="0" width="1600" height="360" fill="#b9d2d9"/>
  <path d="M0 290 C260 230 460 300 720 250 C1040 190 1240 270 1600 205 L1600 360 L0 360 Z" fill="#8fb4bf" opacity=".7"/>
  <rect x="0" y="470" width="1600" height="430" fill="#dfd4c4"/>
  <rect x="880" y="160" width="620" height="620" rx="24" fill="#20384d"/>
  <rect x="910" y="195" width="560" height="540" rx="14" fill="#fff"/>
  <line x1="960" y1="680" x2="1420" y2="680" stroke="#c8ced2" stroke-width="4"/>
  <line x1="960" y1="240" x2="960" y2="680" stroke="#c8ced2" stroke-width="4"/>
  <rect x="960" y="600" width="40" height="80" fill="#2f7d4f" opacity=".8"/>
  <rect x="1010" y="560" width="40" height="120" fill="#2f7d4f" opacity=".8"/>
  <rect x="1060" y="530" width="40" height="150" fill="#c9891a"/>
  <rect x="1110" y="430" width="40" height="250" fill="#c1442e"/>
  <rect x="1160" y="330" width="40" height="350" fill="#c1442e"/>
  <rect x="1210" y="280" width="40" height="400" fill="#8b1d12"/>
  <rect x="1260" y="270" width="40" height="410" fill="#8b1d12"/>
  <path d="M960 610 L1010 560 L1060 510 L1110 380 L1160 290 L1210 250 L1260 245 L1310 250 L1360 270 L1420 300" fill="none" stroke="#0e6f8f" stroke-width="5" stroke-linejoin="round"/>
  <rect x="1130" y="360" width="150" height="30" rx="8" fill="#c1442e" opacity=".15"/>
  <text x="1205" y="380" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#c1442e" text-anchor="middle">RAPID INTENSIFICATION</text>
  <text x="960" y="720" font-family="Arial,sans-serif" font-size="18" fill="#5a6b75">Day 1</text>
  <text x="1110" y="720" font-family="Arial,sans-serif" font-size="18" fill="#5a6b75">Day 2</text>
  <text x="1260" y="720" font-family="Arial,sans-serif" font-size="18" fill="#5a6b75">Day 3</text>
  <g transform="translate(180,300)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#5a9fb5" stroke-width="8" opacity=".5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#5a9fb5" stroke-width="6" opacity=".4"/>
    <circle cx="0" cy="0" r="14" fill="#5a9fb5" opacity=".6"/>
    <text x="0" y="120" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#20384d" text-anchor="middle">Tropical Storm</text>
    <text x="0" y="148" font-family="Arial,sans-serif" font-size="18" fill="#5a6b75" text-anchor="middle">40 mph</text>
  </g>
  <g transform="translate(470,280)">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#c9891a" stroke-width="10" opacity=".6"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#c9891a" stroke-width="8" opacity=".5"/>
    <circle cx="0" cy="0" r="22" fill="#c9891a"/>
    <text x="0" y="130" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#20384d" text-anchor="middle">Cat 1 Hurricane</text>
    <text x="0" y="158" font-family="Arial,sans-serif" font-size="18" fill="#5a6b75" text-anchor="middle">90 mph</text>
  </g>
  <g transform="translate(740,250)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#c1442e" stroke-width="12" opacity=".7"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#c1442e" stroke-width="10" opacity=".55"/>
    <circle cx="0" cy="0" r="35" fill="#c1442e" opacity=".9"/>
    <circle cx="0" cy="0" r="14" fill="#fff"/>
    <text x="0" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#20384d" text-anchor="middle">Cat 4 Hurricane</text>
    <text x="0" y="178" font-family="Arial,sans-serif" font-size="18" fill="#5a6b75" text-anchor="middle">150 mph</text>
  </g>
</svg>
