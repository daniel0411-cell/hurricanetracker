<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hurricane evacuation zone map</title>
  <desc id="desc">A coastal map divided into colored evacuation zones A, B, and C with a highlighted zone and location pin.</desc>
  <rect width="1600" height="900" fill="#e9f1f2"/>
  <rect x="120" y="120" width="1360" height="660" rx="24" fill="#f4f8f8" stroke="#cddedf" stroke-width="6"/>
  <path d="M120 360 Q500 320 800 380 T1480 360 L1480 780 L120 780 Z" fill="#1f7fb0" opacity=".35"/>
  <path d="M120 480 Q500 440 800 500 T1480 480 L1480 780 L120 780 Z" fill="#c9891a" opacity=".30"/>
  <rect x="300" y="600" width="320" height="180" rx="16" fill="#c1442e" opacity=".55"/>
  <text x="460" y="706" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#fff" text-anchor="middle">ZONE A</text>
  <g transform="translate(1080,300)">
    <path d="M0 0 C-46 -58 -46 -126 0 -126 C46 -126 46 -58 0 0 Z" fill="#c1442e"/>
    <circle cx="0" cy="-84" r="28" fill="#fff"/>
  </g>
</svg>
