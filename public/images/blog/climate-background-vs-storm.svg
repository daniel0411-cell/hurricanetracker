<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Climate background versus active storm decisions</title><desc id="desc">A decision flow showing when to use seasonal climate context and when to use official storm observations and warnings.</desc>
  <rect width="1600" height="900" fill="#f3f8fa"/><rect x="70" y="58" width="1460" height="784" rx="22" fill="#fff" stroke="#b7cbd4" stroke-width="3"/>
  <text x="120" y="135" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#123849">Match the information to the decision</text><text x="120" y="180" font-family="Arial,sans-serif" font-size="25" fill="#496773">Seasonal signals provide context; official products guide action.</text>
  <rect x="150" y="300" width="450" height="210" rx="18" fill="#e7f3f7" stroke="#6ca1b5" stroke-width="3"/><text x="205" y="365" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123849">Planning question</text><text x="205" y="415" font-family="Arial,sans-serif" font-size="23" fill="#334f5a">How early should I prepare?</text><text x="205" y="455" font-family="Arial,sans-serif" font-size="21" fill="#334f5a">Use El Niño and seasonal outlooks</text>
  <path d="M630 405 H900" stroke="#5f9db5" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="1000" y="300" width="450" height="210" rx="18" fill="#fff0e9" stroke="#d98a70" stroke-width="3"/><text x="1055" y="365" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#6e2d19">Safety question</text><text x="1055" y="415" font-family="Arial,sans-serif" font-size="23" fill="#63382c">What should I do now?</text><text x="1055" y="455" font-family="Arial,sans-serif" font-size="21" fill="#63382c">Use NHC, NWS and local orders</text>
  <rect x="300" y="610" width="1000" height="90" rx="16" fill="#f5f7f8" stroke="#9bb6c0"/><text x="345" y="665" font-family="Arial,sans-serif" font-size="24" fill="#334f5a">A climate pattern cannot identify one city's landfall, intensity or evacuation timing.</text>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#5f9db5"/></marker></defs>
</svg>
