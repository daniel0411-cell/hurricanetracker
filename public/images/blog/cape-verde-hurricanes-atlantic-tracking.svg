<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="ocean" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a3d62"/>
      <stop offset="100%" stop-color="#051e3e"/>
    </radialGradient>
    <radialGradient id="storm" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#f5f5f5" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#b0c4de" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#4682b4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a3d62" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ocean)"/>
  <!-- Spiral storm -->
  <g transform="translate(420,290)">
    <ellipse cx="0" cy="0" rx="180" ry="120" fill="url(#storm)" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="80" ry="55" fill="#e8e8e8" opacity="0.8"/>
    <circle cx="0" cy="0" r="25" fill="#051e3e"/>
  </g>
  <!-- Track line -->
  <path d="M 200 200 Q 350 250 420 290 T 800 400 L 1050 450" stroke="#e74c3c" stroke-width="3" fill="none" stroke-dasharray="8,6" opacity="0.8"/>
  <!-- Cape Verde label dot -->
  <circle cx="200" cy="200" r="6" fill="#e74c3c"/>
  <text x="210" y="195" fill="#fff" font-family="Arial,sans-serif" font-size="16" opacity="0.9">Cape Verde</text>
  <!-- US coast label dot -->
  <circle cx="1050" cy="450" r="6" fill="#2ecc71"/>
  <text x="980" y="475" fill="#fff" font-family="Arial,sans-serif" font-size="16" opacity="0.9">U.S. Coast</text>
  <!-- Title -->
  <text x="600" y="560" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="bold" text-anchor="middle" opacity="0.95">Cape Verde Hurricanes: Atlantic Tracking</text>
</svg>
