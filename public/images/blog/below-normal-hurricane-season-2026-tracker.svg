<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="stormGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    <linearGradient id="elaninoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7931e"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Atlantic ocean outline (simplified) -->
  <path d="M 100 200 C 200 150, 300 140, 450 160 C 550 170, 600 200, 580 280 C 560 350, 500 380, 420 400 C 350 420, 280 440, 200 470 C 150 490, 120 510, 140 540 C 160 570, 200 580, 260 560 C 320 540, 380 500, 440 480" stroke="#2a4a6a" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Gulf of Mexico / US outline -->
  <path d="M 400 160 C 420 120, 460 100, 500 100 C 540 100, 560 120, 560 150 C 560 180, 540 200, 580 220 C 620 240, 640 260, 620 300 C 600 340, 560 360, 500 370 C 450 380, 400 400, 380 420" stroke="#2a4a6a" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Storm markers for Arthur and Bertha (Gulf) -->
  <circle cx="470" cy="200" r="18" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.6"/>
  <circle cx="470" cy="200" r="6" fill="#ff6b35" opacity="0.4"/>
  <text x="470" y="235" text-anchor="middle" fill="#ff6b35" opacity="0.5" font-size="11" font-family="sans-serif">Arthur</text>

  <circle cx="510" cy="250" r="14" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.6"/>
  <circle cx="510" cy="250" r="5" fill="#ff6b35" opacity="0.4"/>
  <text x="510" y="280" text-anchor="middle" fill="#ff6b35" opacity="0.5" font-size="11" font-family="sans-serif">Bertha</text>

  <!-- Potential Cristobal (Cape Verde area) -->
  <circle cx="250" cy="290" r="20" fill="none" stroke="#f7931e" stroke-width="2" stroke-dasharray="6 4" filter="url(#softGlow)"/>
  <circle cx="250" cy="290" r="5" fill="#f7931e"/>
  <text x="250" y="325" text-anchor="middle" fill="#f7931e" font-size="11" font-family="sans-serif">Cristobal?</text>

  <!-- El Nino annotation -->
  <rect x="700" y="140" width="200" height="80" rx="8" fill="none" stroke="#f7931e" stroke-width="1" opacity="0.4"/>
  <text x="800" y="170" text-anchor="middle" fill="#f7931e" font-size="13" font-family="sans-serif" opacity="0.7">El Niño</text>
  <text x="800" y="190" text-anchor="middle" fill="#8a9bb5" font-size="12" font-family="sans-serif">Increased wind shear</text>
  <text x="800" y="207" text-anchor="middle" fill="#8a9bb5" font-size="12" font-family="sans-serif">suppressing hurricanes</text>

  <!-- Central device mockup: phone showing hurricane tracker -->
  <rect x="820" y="300" width="220" height="280" rx="20" fill="#12233d" stroke="#2a4a6a" stroke-width="2"/>
  <rect x="835" y="320" width="190" height="200" rx="4" fill="#0d1a2d"/>
  <!-- Hurricane icon on screen -->
  <circle cx="885" cy="370" r="22" fill="none" stroke="#ff6b35" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 875 365 Q 885 350, 895 365 Q 905 350, 885 385 Q 865 350, 875 365" fill="#ff6b35" opacity="0.3"/>
  <!-- Track line on screen -->
  <path d="M 840 400 C 860 390, 880 385, 900 395" stroke="#4a7aaa" stroke-width="1.5" fill="none"/>
  <circle cx="900" cy="395" r="3" fill="#4a7aaa"/>
  <!-- Alert bar -->
  <rect x="840" y="415" width="180" height="22" rx="3" fill="#ff3d00" opacity="0.2"/>
  <rect x="840" y="415" width="180" height="3" rx="1.5" fill="#ff3d00"/>
  <text x="930" y="431" text-anchor="middle" fill="#ff6b35" font-size="9" font-family="sans-serif">⚠ Storm Surge Watch</text>
  <!-- Phone bottom bar -->
  <rect x="835" y="530" width="190" height="1" fill="#2a4a6a" opacity="0.3"/>
  <text x="930" y="555" text-anchor="middle" fill="#4a7aaa" font-size="10" font-family="sans-serif">Real-Time Tracker</text>

  <!-- Wi-Fi / signal icon on phone -->
  <path d="M 820 320 Q 830 305, 840 320" stroke="#8a9bb5" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 814 316 Q 830 295, 846 316" stroke="#8a9bb5" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Title area -->
  <text x="600" y="520" text-anchor="middle" fill="#ffffff" font-size="38" font-family="sans-serif" font-weight="bold" letter-spacing="-0.5">Below-Normal Hurricane Season</text>
  <text x="600" y="565" text-anchor="middle" fill="#4a7aaa" font-size="22" font-family="sans-serif" letter-spacing="0.5">Why You Still Need a Real-Time Tracker</text>

  <!-- Subtitle -->
  <text x="600" y="600" text-anchor="middle" fill="#8a9bb5" font-size="14" font-family="sans-serif">NOAA 2026 Outlook · El Niño · 2 Gulf Storms · Cristobal Developing · Peak Season Ahead</text>
</svg>