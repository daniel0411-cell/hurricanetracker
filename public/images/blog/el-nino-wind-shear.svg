<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vertical wind shear and hurricane organization</title><desc id="desc">An educational diagram showing vertical wind shear tilting a tropical cyclone circulation.</desc>
  <rect width="1600" height="900" fill="#f3f8fa"/><rect x="70" y="58" width="1460" height="784" rx="22" fill="#fff" stroke="#b7cbd4" stroke-width="3"/>
  <text x="120" y="135" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#123849">Why vertical wind shear matters</text><text x="120" y="180" font-family="Arial,sans-serif" font-size="25" fill="#496773">A difference in wind with height can disrupt a developing circulation.</text>
  <line x1="250" y1="690" x2="1350" y2="690" stroke="#9bb6c0" stroke-width="3"/><line x1="250" y1="690" x2="250" y2="250" stroke="#9bb6c0" stroke-width="3"/><text x="170" y="270" font-family="Arial,sans-serif" font-size="23" fill="#496773">Higher</text><text x="180" y="720" font-family="Arial,sans-serif" font-size="23" fill="#496773">Surface</text>
  <path d="M440 575 C570 540 670 455 730 350" fill="none" stroke="#3a91b0" stroke-width="13" stroke-linecap="round"/><path d="M590 595 C750 560 875 480 1030 360" fill="none" stroke="#e78a3b" stroke-width="13" stroke-linecap="round"/>
  <text x="390" y="635" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24657d">Lower-level wind</text><text x="960" y="325" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#9a4f1d">Upper-level wind</text>
  <path d="M790 565 C850 520 920 500 990 520 C1040 535 1080 580 1070 625 C1055 675 980 700 900 675 C830 655 770 615 790 565 Z" fill="#dceef4" stroke="#5f9db5" stroke-width="4"/><path d="M830 585 C900 625 970 630 1035 585" fill="none" stroke="#123849" stroke-width="7"/><path d="M850 550 C915 510 985 510 1045 550" fill="none" stroke="#123849" stroke-width="7"/>
  <rect x="420" y="760" width="760" height="48" rx="12" fill="#fff0e9"/><text x="455" y="793" font-family="Arial,sans-serif" font-size="22" fill="#63382c">Shear can reduce organization, but it never guarantees that a storm cannot form.</text>
</svg>
